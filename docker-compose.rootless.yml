services:
  ai-toolkit:
    build:
      context: .
      dockerfile: docker/Dockerfile.rootless
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    image: ${AI_TOOLKIT_IMAGE:-aitoolkit-rootless:latest}
    container_name: ${AI_TOOLKIT_CONTAINER:-ai-toolkit-rootless}
    restart: unless-stopped
    ports:
      - "${AI_TOOLKIT_PORT:-8675}:8675"
    volumes:
      - ${HF_CACHE_DIR:-./cache/huggingface}:/cache/huggingface
      - ./data:/data
      - ./datasets:/app/ai-toolkit/datasets
      - ./output:/app/ai-toolkit/output
      - ./config:/app/ai-toolkit/config
    environment:
      - AI_TOOLKIT_AUTH=${AI_TOOLKIT_AUTH:?Set AI_TOOLKIT_AUTH in .env}
      - HF_HOME=/cache/huggingface
      - HF_HUB_CACHE=/cache/huggingface/hub
      - NODE_ENV=production
      - TZ=UTC
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
